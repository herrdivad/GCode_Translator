[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gcode-translator"
version = "1.2.0"
description = "A tool for translating and converting GCode and Binary GCode formats"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "David Herrmann", email = "david.herrmann@kit.edu" }
]
dependencies = [
  "platformdirs"
]

[project.optional-dependencies]
scrape = ["selenium", "beautifulsoup4"]   # only needed to re-scrape the Marlin mapping
dev = ["pytest"]

# Native bgcode binaries are shipped as separate, opt-in companion packages so the
# base install stays binary-free (and free of the AGPL-3.0 binary). Each extra pulls
# its platform's companion via a git direct reference and is guarded by a platform
# marker, so installing the "wrong" extra on a given OS is simply a no-op.
# Usage: pip install "gcode-translator[linux] @ git+https://github.com/herrdivad/GCode_Translator.git@v1.2.0"
linux = [
  "gcode-translator-bgcode-linux @ git+https://github.com/herrdivad/GCode_Translator.git@v1.2.0#subdirectory=companion/bgcode-linux ; sys_platform == 'linux'",
]
# The Windows companion exists (companion/bgcode-windows). The macOS extra is still a
# placeholder for when its binary is added under companion/bgcode-macos; requesting
# [macos] on darwin fails cleanly until then.
windows = [
  "gcode-translator-bgcode-windows @ git+https://github.com/herrdivad/GCode_Translator.git@v1.2.0#subdirectory=companion/bgcode-windows ; sys_platform == 'win32'",
]
macos = [
  "gcode-translator-bgcode-macos @ git+https://github.com/herrdivad/GCode_Translator.git@v1.2.0#subdirectory=companion/bgcode-macos ; sys_platform == 'darwin'",
]

[project.scripts]
gcode-translator = "gcode_translator.GCode_Translator:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: integration tests over large real files (deselect with '-m \"not slow\"')",
]

[tool.setuptools]
packages = ["gcode_translator"]
include-package-data = true

# This package ships no AGPL-covered material: the bgcode binary and its AGPL-3.0
# license text now live in the platform companion packages under companion/. The
# base package is MIT-only; the runtime AGPL-3.0 notice is just a text pointer to the
# upstream source (see BGCODE_LICENSE_HINT in GCode_Translator.py).
[tool.setuptools.package-data]
"gcode_translator" = ["*.json"]
